services:
  backend:
    build:
      context: ./Backend
      dockerfile: Dockerfile
    container_name: quantum-backend
    restart: unless-stopped
    env_file:
      - ./.env
    expose:
      - "5000"
    environment:
      - NODE_ENV=production
      - PORT=5000
      - DB_PATH=/app/data/quantum.sqlite
    volumes:
      - sqlite_data:/app/data
      - uploads_data:/app/uploads

  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: quantum-cloudflared
    restart: unless-stopped
    command: tunnel --no-autoupdate run --token ${CLOUDFLARED_TOKEN}
    depends_on:
      - backend

volumes:
  sqlite_data:
  uploads_data:
